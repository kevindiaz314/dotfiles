packages:
  linux:
    pacman:
      - fish
      - openssh
      - keyd
      - tailscale
      - noctalia
      - nodejs
      - npm
      - bun
      - helium-browser-bin

    # Paru comes pre-installed on CachyOS; Yay is supported as a fallback.
    aur: []

  darwin:
    taps:
      - barutsrb/tap

    brews:
      - atuin
      - bat
      - bun
      - chezmoi
      - eza
      - fastfetch
      - fish
      - fzf
      - lazygit
      - neovim
      - node
      - oh-my-posh
      - ripgrep
      - superfile
      - yazi
      - zoxide

    casks:
      - atuin-desktop
      - cursor
      - discord
      - ghostty
      - localsend
      - logi-options+
      - nextcloud
      - omniwm
      - spotify
      - tailscale-app
      - thebrowsercompany-dia
      - warp

  # Installed by run_onchange_after_50-install-coding-agents. Agents already
  # on PATH are never touched, so switching an agent's method only affects
  # fresh machines.
  #   method: npm | bun | curl
  #   completions: optional argument list whose stdout is written to
  #                ~/.config/fish/completions/<name>.fish
  coding_agents:
    # The vendor installer ships a self-updating standalone binary.
    - name: claude
      method: curl
      url: "https://claude.ai/install.sh"

    - name: codex
      method: npm
      package: "@openai/codex"
      completions: [codex, completion, fish]

    # Upstream supports the Bun runtime only.
    - name: omp
      method: bun
      package: "@oh-my-pi/pi-coding-agent"
      completions: [omp, completions, fish]

    # OpenCode 2 is currently published on the next channel and requires its
    # postinstall script to select the native binary for this platform.
    - name: opencode2
      method: bun
      package: "@opencode-ai/cli@next"
      trust: true
