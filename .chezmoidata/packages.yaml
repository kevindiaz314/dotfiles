packages:
  linux:
    pacman:
      - fish
      - openssh
      - keyd
      - tailscale
      - noctalia
      - nodejs
      - npm
      - bun
      - helium-browser-bin

    # Paru comes pre-installed on CachyOS; Yay is supported as a fallback.
    aur: []

  darwin:
    taps: []

    brews:
      - fish
      - node
      - bun
      - eza
      - lazygit
      - ripgrep

    casks:
      - tailscale-app

  # Installed by run_onchange_after_50-install-coding-agents. Agents already
  # on PATH are never touched, so switching an agent's method only affects
  # fresh machines.
  #   method: npm | bun | curl
  #   completions: optional argument list whose stdout is written to
  #                ~/.config/fish/completions/<name>.fish
  coding_agents:
    # The vendor installer ships a self-updating standalone binary.
    - name: claude
      method: curl
      url: "https://claude.ai/install.sh"

    - name: codex
      method: npm
      package: "@openai/codex"
      completions: [codex, completion, fish]

    # Upstream supports the Bun runtime only.
    - name: omp
      method: bun
      package: "@oh-my-pi/pi-coding-agent"
      completions: [omp, completions, fish]

    - name: opencode
      method: bun
      package: "opencode-ai"
