# Keep platform names explicit because package names and availability differ.
packages:
  linux:
    # Prefer official repositories when possible.
    pacman:
      - fish
      - keyd
      - tailscale
      - zsh

    # Paru is preferred on CachyOS; Yay is supported as a fallback.
    aur:
      - helium-browser-bin

  darwin:
    # Add taps only when a package is unavailable in Homebrew core.
    taps: []

    # CLI packages.
    brews:
      - fish

    # GUI applications.
    casks:
      - helium-browser
      - tailscale-app
